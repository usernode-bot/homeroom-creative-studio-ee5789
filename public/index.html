<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Homeroom Creative Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='9' cy='9' r='5.5' fill='%2300aaa8'/><circle cx='15' cy='9' r='5.5' fill='%23c41670'/><circle cx='12' cy='15' r='5.5' fill='%23ffd43b' fill-opacity='0.9'/></svg>">
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/usernode-native/v1/native.css">
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <script src="/usernode-native/v1/native.js"></script>
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <div class="mx-auto flex min-h-screen w-full max-w-3xl flex-col">
    <header class="sticky top-0 z-30 flex items-center gap-3 border-b border-line bg-ground/95 px-4 py-3 backdrop-blur">
      <svg viewBox="0 0 24 24" class="h-7 w-7 flex-none" aria-hidden="true">
        <circle cx="9" cy="9" r="5.5" class="fill-cyan" fill-opacity="0.85"/>
        <circle cx="15" cy="9" r="5.5" class="fill-magenta" fill-opacity="0.85"/>
        <circle cx="12" cy="15" r="5.5" class="fill-yellow" fill-opacity="0.85"/>
      </svg>
      <h1 class="flex-1 text-heading">Studio</h1>
      <button data-new-project class="btn-primary text-small">New project</button>
    </header>

    <main data-view class="flex-1 px-4 pb-24 pt-4"></main>

    <nav data-tabbar
      class="fixed inset-x-0 bottom-0 z-30 mx-auto flex w-full max-w-3xl border-t border-line bg-surface un-safe-bottom">
      <button data-tab="home" class="flex min-h-14 flex-1 flex-col items-center justify-center gap-0.5 text-small text-muted">
        Home</button>
      <button data-tab="projects" class="flex min-h-14 flex-1 flex-col items-center justify-center gap-0.5 text-small text-muted">
        Projects</button>
      <button data-tab="templates" class="flex min-h-14 flex-1 flex-col items-center justify-center gap-0.5 text-small text-muted">
        Templates</button>
    </nav>
  </div>

  <input type="file" accept="image/*" data-file-input class="hidden">
  <div data-sheet-root></div>
  <div data-toast class="pointer-events-none fixed left-1/2 top-3 z-50 -translate-x-1/2 rounded-lg bg-accent px-4 py-2 text-small text-on-accent opacity-0 transition-opacity"></div>

  <script type="module" src="/js/render.js"></script>
  <script type="module" src="/js/formats.js"></script>
  <script type="module" src="/js/tools.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
